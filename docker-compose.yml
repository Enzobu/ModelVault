services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?required}
      MARIADB_USER: ${MARIADB_USER:?required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?required}
    volumes:
      - ${MARIADB_DATA_PATH:?required}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_URL: ${AUTH_URL:?required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?required}
      GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:-}
      DRIVE_SYNC_CRON_SECRET: ${DRIVE_SYNC_CRON_SECRET:-}
    volumes:
      - ${THUMBNAILS_PATH:?required}:/app/data/thumbnails
      - ${CACHE_PATH:?required}:/app/data/cache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  drive-sync-worker:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DRIVE_SYNC_CRON_SECRET: ${DRIVE_SYNC_CRON_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -n "$$DRIVE_SYNC_CRON_SECRET" ]; then
            curl -sS --connect-timeout 5 --max-time 1800 -X POST \
              http://app:3000/api/internal/drive-sync \
              -H "x-sync-secret: $$DRIVE_SYNC_CRON_SECRET" || true
          fi
          sleep 60
        done
