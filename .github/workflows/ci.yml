name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: mysql://modelvault:dummy@localhost:3306/modelvault
      - name: Validate Docker Compose configuration
        env:
          MARIADB_DATABASE: modelvault
          MARIADB_USER: modelvault
          MARIADB_PASSWORD: dummy
          MARIADB_ROOT_PASSWORD: dummy
          MARIADB_DATA_PATH: /tmp/modelvault/mariadb
          THUMBNAILS_PATH: /tmp/modelvault/thumbnails
          CACHE_PATH: /tmp/modelvault/cache
          DATABASE_URL: mysql://modelvault:dummy@database:3306/modelvault
          AUTH_SECRET: dummy
          AUTH_URL: https://example.com
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          INITIAL_ADMIN_EMAIL: admin@example.com
        run: docker compose -f docker-compose.yml config --quiet
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          DATABASE_URL: mysql://modelvault:dummy@localhost:3306/modelvault
  deploy-pre-prod:
    name: Deploy pre-prod
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy pre-prod
        env:
          DOKPLOY_PREPROD_API_KEY: ${{ secrets.DOKPLOY_PREPROD_API_KEY }}
          DOKPLOY_PREPROD_COMPOSE_ID: ${{ secrets.DOKPLOY_PREPROD_COMPOSE_ID }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_PREPROD_API_KEY"
          test -n "$DOKPLOY_PREPROD_COMPOSE_ID"
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w '%{http_code}' \
            -X POST "https://dokploy-preprod.enzo-palermo.com/api/compose.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_PREPROD_API_KEY" \
            -d "{\"composeId\":\"$DOKPLOY_PREPROD_COMPOSE_ID\"}")
          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy build and deploy
        env:
          DOKPLOY_PROD_API_KEY: ${{ secrets.DOKPLOY_PROD_API_KEY }}
          DOKPLOY_PROD_COMPOSE_ID: ${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_PROD_API_KEY"
          test -n "$DOKPLOY_PROD_COMPOSE_ID"
          test -n "$DOKPLOY_URL"
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w '%{http_code}' \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_PROD_API_KEY" \
            -d "{\"composeId\":\"$DOKPLOY_PROD_COMPOSE_ID\"}")
          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
