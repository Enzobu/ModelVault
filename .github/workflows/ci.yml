name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: mysql://modelvault:dummy@localhost:3306/modelvault
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          DATABASE_URL: mysql://modelvault:dummy@localhost:3306/modelvault
  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy build and deploy
        env:
          DOKPLOY_PROD_API_KEY: ${{ secrets.DOKPLOY_PROD_API_KEY }}
          DOKPLOY_PROD_COMPOSE_ID: ${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_PROD_API_KEY"
          test -n "$DOKPLOY_PROD_COMPOSE_ID"
          test -n "$DOKPLOY_URL"
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w '%{http_code}' \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_PROD_API_KEY" \
            -d "{\"composeId\":\"$DOKPLOY_PROD_COMPOSE_ID\"}")
          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
